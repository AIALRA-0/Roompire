name: E2E

on:
  push:
    branches: [main, "feat/**", "fix/**", "test/**", "chore/**", "ops/**", "db/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: roompire
          POSTGRES_PASSWORD: roompire
          POSTGRES_DB: roompire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roompire -d roompire_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Prepare database
        run: pnpm e2e:prepare
        env:
          DATABASE_URL: postgresql://roompire:roompire@localhost:5432/roompire_test
      - name: Build
        run: pnpm build
      - name: E2E real browser tests
        run: pnpm e2e
        env:
          DATABASE_URL: postgresql://roompire:roompire@localhost:5432/roompire_test
          ROOMPIRE_E2E_SKIP_DB_RESET: "true"
          ROOMPIRE_E2E_PORT: "3100"
          ROOMPIRE_E2E_WORKERS: "1"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
