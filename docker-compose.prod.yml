name: roompire

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${ROOMPIRE_WEB_IMAGE:-roompire-web:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL}
      HOSTNAME: 0.0.0.0
      ROOMPIRE_ENABLE_DEV_AUTH: ${ROOMPIRE_ENABLE_DEV_AUTH:-false}
      ROOMPIRE_DEV_SESSION_EMAIL: ${ROOMPIRE_DEV_SESSION_EMAIL:-alice@example.test}
      ROOMPIRE_FILE_SIGNING_SECRET: ${ROOMPIRE_FILE_SIGNING_SECRET:?Set ROOMPIRE_FILE_SIGNING_SECRET}
      ROOMPIRE_EXPORT_SIGNING_SECRET: ${ROOMPIRE_EXPORT_SIGNING_SECRET:?Set ROOMPIRE_EXPORT_SIGNING_SECRET}
      ROOMPIRE_FX_PROVIDER: ${ROOMPIRE_FX_PROVIDER:-frankfurter}
      ROOMPIRE_FILE_STORAGE_PROVIDER: ${ROOMPIRE_FILE_STORAGE_PROVIDER:-local}
      ROOMPIRE_S3_BUCKET: ${ROOMPIRE_S3_BUCKET:-}
      ROOMPIRE_S3_REGION: ${ROOMPIRE_S3_REGION:-}
      ROOMPIRE_S3_ENDPOINT: ${ROOMPIRE_S3_ENDPOINT:-}
      ROOMPIRE_S3_ACCESS_KEY_ID: ${ROOMPIRE_S3_ACCESS_KEY_ID:-}
      ROOMPIRE_S3_SECRET_ACCESS_KEY: ${ROOMPIRE_S3_SECRET_ACCESS_KEY:-}
      ROOMPIRE_S3_FORCE_PATH_STYLE: ${ROOMPIRE_S3_FORCE_PATH_STYLE:-false}
      ROOMPIRE_SITE_GATE_USERNAME: ${ROOMPIRE_SITE_GATE_USERNAME:?Set ROOMPIRE_SITE_GATE_USERNAME}
      ROOMPIRE_SITE_GATE_PASSWORD: ${ROOMPIRE_SITE_GATE_PASSWORD:?Set ROOMPIRE_SITE_GATE_PASSWORD}
      ROOMPIRE_SITE_GATE_SESSION_EMAIL: ${ROOMPIRE_SITE_GATE_SESSION_EMAIL:-}
      ROOMPIRE_OPS_STATUS_FILE: ${ROOMPIRE_OPS_STATUS_FILE:-/app/ops/status/ops-status.json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const u=process.env.ROOMPIRE_SITE_GATE_USERNAME,p=process.env.ROOMPIRE_SITE_GATE_PASSWORD,h={};if(u&&p)h.Authorization='Basic '+Buffer.from(u+':'+p).toString('base64');fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/v1/health',{headers:h}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1));",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - roompire-uploads:/app/apps/web/.roompire_uploads
      - ./ops/status:/app/ops/status:ro

  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrator
    image: ${ROOMPIRE_MIGRATOR_IMAGE:-roompire-migrator:latest}
    profiles: ["migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrator
    image: ${ROOMPIRE_MIGRATOR_IMAGE:-roompire-migrator:latest}
    command: ["pnpm", "db:seed"]
    profiles: ["seed"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["caddy"]
    environment:
      ROOMPIRE_DOMAIN: ${ROOMPIRE_DOMAIN:-roompire.aialra.online}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
    name: roompire_postgres_data
  redis-data:
    name: roompire_redis_data
  roompire-uploads:
    name: roompire_uploads
  caddy-data:
    name: roompire_caddy_data
  caddy-config:
    name: roompire_caddy_config
