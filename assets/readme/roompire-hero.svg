<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Roompire shared-house operating system</title>
  <desc id="desc">An approval proposal moves through a locked foreign-exchange rate into an append-only ledger while household tasks remain visible on a shared calendar</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d1c"/>
      <stop offset="0.52" stop-color="#0e2f2b"/>
      <stop offset="1" stop-color="#113d3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#61e5c4"/>
      <stop offset="1" stop-color="#2aa984"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#153d39"/>
      <stop offset="1" stop-color="#0f302e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#001210" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#71e9ca"/>
    </marker>
  </defs>

  <rect width="1440" height="720" rx="34" fill="url(#bg)"/>
  <circle cx="125" cy="90" r="220" fill="#4bd5b1" opacity="0.08"/>
  <circle cx="1340" cy="660" r="310" fill="#72e7c8" opacity="0.07"/>

  <g transform="translate(104 72)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="76" height="76" rx="20" fill="url(#accent)"/>
    <path d="M20 38L38 22l18 16v23H20Z" fill="#073029"/>
    <path d="M28 46h20M28 54h14" stroke="#8af1d5" stroke-width="4" stroke-linecap="round"/>
    <text x="108" y="47" fill="#ffffff" font-size="48" font-weight="780">Roompire</text>
    <text x="110" y="80" fill="#a8c9c3" font-size="18">Shared-house expenses, approvals, ledger, and calendar operations</text>
  </g>

  <g transform="translate(1087 88)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="720">
    <rect width="106" height="35" rx="17.5" fill="#1b524a" stroke="#54d6b5"/>
    <text x="53" y="23" text-anchor="middle" fill="#aff5e2">PWA FIRST</text>
    <rect x="118" width="124" height="35" rx="17.5" fill="#294c45" stroke="#78c9b4"/>
    <text x="180" y="23" text-anchor="middle" fill="#ccebe3">ZH · EN</text>
  </g>

  <g transform="translate(74 236)" font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g>
      <rect width="330" height="326" rx="27" fill="url(#card)" stroke="#307d6e" stroke-width="2"/>
      <circle cx="54" cy="57" r="25" fill="#1b5f50" stroke="#55d2b0"/>
      <path d="M43 56h22M43 48h16M43 64h13" stroke="#a6f2dd" stroke-width="4" stroke-linecap="round"/>
      <text x="92" y="65" fill="#ffffff" font-size="24" font-weight="730">Expense proposal</text>
      <text x="36" y="110" fill="#a5c6c0" font-size="15">Submitted for review</text>
      <rect x="36" y="137" width="258" height="58" rx="14" fill="#113430" stroke="#3f8275"/>
      <text x="56" y="161" fill="#d9eee9" font-size="15" font-weight="680">Share A</text>
      <text x="272" y="161" text-anchor="end" fill="#8de9d1" font-size="14">approved</text>
      <text x="56" y="182" fill="#d9eee9" font-size="15" font-weight="680">Share B</text>
      <text x="272" y="182" text-anchor="end" fill="#f4ce83" font-size="14">pending</text>
      <rect x="36" y="218" width="258" height="61" rx="14" fill="#0d2b28" stroke="#315d55"/>
      <text x="165" y="245" text-anchor="middle" fill="#c6ddd8" font-size="14">Pending shares stay outside</text>
      <text x="165" y="265" text-anchor="middle" fill="#c6ddd8" font-size="14">the formal balance</text>
    </g>

    <g transform="translate(480 0)">
      <rect width="330" height="326" rx="27" fill="url(#card)" stroke="#307d6e" stroke-width="2"/>
      <circle cx="165" cy="75" r="45" fill="#17483f" stroke="#63d9bb" stroke-width="3"/>
      <path d="M146 74h38M153 61h24M154 88h22" stroke="#a8f4df" stroke-width="5" stroke-linecap="round"/>
      <text x="165" y="151" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="730">Locked FX</text>
      <text x="165" y="185" text-anchor="middle" fill="#a7c7c1" font-size="15">Rate · date · provider · policy</text>
      <rect x="38" y="216" width="254" height="65" rx="15" fill="#123834" stroke="#47a68f"/>
      <text x="165" y="244" text-anchor="middle" fill="#8fe9d2" font-size="16" font-weight="700">IMMUTABLE HISTORY</text>
      <text x="165" y="265" text-anchor="middle" fill="#bad8d1" font-size="13">Later rate changes do not rewrite debt</text>
    </g>

    <g transform="translate(960 0)">
      <rect width="330" height="326" rx="27" fill="url(#card)" stroke="#307d6e" stroke-width="2"/>
      <text x="36" y="63" fill="#ffffff" font-size="24" font-weight="730">Household calendar</text>
      <text x="36" y="96" fill="#a5c6c0" font-size="15">Bills · chores · tasks · events</text>
      <g transform="translate(36 126)">
        <rect width="258" height="154" rx="17" fill="#102f2c" stroke="#3f7e71"/>
        <path d="M0 42h258M64 42v112M129 42v112M194 42v112M0 80h258M0 117h258" stroke="#2b5a52" stroke-width="2"/>
        <circle cx="96" cy="61" r="10" fill="#64d7b9"/>
        <rect x="144" y="90" width="34" height="13" rx="6.5" fill="#e6bd69"/>
        <path d="M218 58l8 8 15-18" fill="none" stroke="#80ead0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <path d="M404 399h142" stroke="#6fe5c6" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <path d="M884 399h142" stroke="#6fe5c6" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrow)"/>

  <text x="720" y="646" text-anchor="middle" fill="#9abbb5" font-size="17" font-family="Inter,Segoe UI,Arial,sans-serif">Approval before debt · auditable FX history · shared household operations</text>
</svg>
