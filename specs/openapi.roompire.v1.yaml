  /households/{householdId}/tasks/{taskId}/complete:
    post:
      summary: Complete task
      description: Owners, admins, and members can complete a household task. Linked calendar TASK events are marked completed.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Replays the stored response for the same user, key, endpoint, and request body. Reusing the key with a different request returns 409.
          schema: { type: string, maxLength: 160 }
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: taskId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteTaskRequest" }
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "400":
          description: Validation error or missing Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller is a viewer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Task not found or inaccessible household
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Idempotent request is in progress or Idempotency-Key was reused with a different request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/tasks/{taskId}/create-expense-proposal:
    post:
      summary: Create an expense proposal from a task
      description: Owners and admins can create a linked submitted proposal from any household task. Members can create one from tasks they created or are assigned to. The generated proposal remains pending and does not affect formal ledger balances until debtor approval.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Replays the stored response for the same user, key, endpoint, and request body. Reusing the key with a different request returns 409.
          schema: { type: string, maxLength: 160 }
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: taskId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskExpenseProposalRequest" }
      responses:
        "201":
          description: Linked expense proposal created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseProposalResponse" }
        "400":
          description: Validation error, invalid participant, FX rate required, or missing Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller is a viewer or member without task ownership/assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Task not found or inaccessible household
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Task already has a linked expense proposal, idempotent request is in progress, or Idempotency-Key was reused with a different request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/stats/summary:
    get:
      summary: Get household statistics summary
      description: Returns read-only proposal, ledger, task, audit, receipt, and proposal trend totals for the active household. Optional from/to query dates select an inclusive statistics window.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: from
          description: Inclusive window start date. Proposals use expenseDate; tasks use dueAt or createdAt; audit, receipts, obligations, and settlements use their operational timestamps.
          schema: { type: string, format: date }
        - in: query
          name: to
          description: Inclusive window end date.
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsSummaryResponse" }
        "400":
          description: Invalid statistics query
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Household not found or caller is not an active member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/stats/categories:
    get:
      summary: List category statistics
      description: Returns read-only proposal totals and matured share totals grouped by expense category. Optional from/to query dates filter by proposal expenseDate.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: from
          description: Inclusive proposal expenseDate window start date.
          schema: { type: string, format: date }
        - in: query
          name: to
          description: Inclusive proposal expenseDate window end date.
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryStatsListResponse" }
        "400":
          description: Invalid statistics query
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Household not found or caller is not an active member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/stats/members:
    get:
      summary: List member statistics
      description: Returns read-only proposal, payer, obligation, and confirmed settlement totals for active household members. Optional from/to query dates filter proposals by expenseDate, obligations by creation time, and settlements by settlementDate.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: from
          description: Inclusive statistics window start date.
          schema: { type: string, format: date }
        - in: query
          name: to
          description: Inclusive statistics window end date.
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberStatsListResponse" }
        "400":
          description: Invalid statistics query
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Household not found or caller is not an active member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/exports:
    post:
      summary: Create household export
      description: Creates a signed short-lived download URL for a read-only household dataset export.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExportRequest" }
      responses:
        "201":
          description: Export ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Household not found or caller is not an active member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/exports/{exportId}:
    get:
      summary: Download household export
      description: Downloads the signed export as JSON or CSV. The caller must still be an active member of the household.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: exportId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Export file
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/csv:
              schema:
                type: string
        "403":
          description: Export token is invalid or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Household not found or caller is not an active member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/audit-events:
    get:
      summary: List audit events
      description: Returns immutable household audit events, ordered newest first, with optional filters and a tamper-evident hash-chain verification summary.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: action
          schema: { type: string, maxLength: 120 }
          description: Case-insensitive action substring filter.
        - in: query
          name: actorUserId
          schema: { type: string, format: uuid }
        - in: query
          name: entityType
          schema: { type: string, maxLength: 80 }
          description: Case-insensitive entity type substring filter.
        - in: query
          name: entityId
          schema: { type: string, format: uuid }
        - in: query
          name: from
          schema: { type: string, format: date }
          description: Inclusive lower occurred-at bound. ISO date-time is also accepted.
        - in: query
          name: to
          schema: { type: string, format: date }
          description: Inclusive upper occurred-at bound. ISO date-time is also accepted.
        - in: query
          name: cursor
          schema: { type: string, format: uuid }
          description: Cursor returned from the previous audit event page.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventListResponse" }
        "404":
          description: Household not found or caller is not an active member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
