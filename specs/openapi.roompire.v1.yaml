openapi: 3.1.0
info:
  title: Roompire API
  version: 0.1.0
  description: >
    Roompire PWA-first shared-house ledger, approval, FX, calendar, task, and audit API.
    Unsafe browser-style API mutations with cross-site request metadata are rejected
    before route handlers with `403 CSRF_ORIGIN_MISMATCH`.
servers:
  - url: https://roompire.aialra.online/api/v1
    description: Production
  - url: http://localhost:3000/api/v1
    description: Local development
security:
  - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: roompire_session
  responses:
    CsrfForbidden:
      description: Unsafe browser-style mutation was rejected by the CSRF origin guard.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 1 }
        RateLimit-Limit:
          description: Maximum requests allowed in the current window.
          schema: { type: integer, minimum: 1 }
        RateLimit-Remaining:
          description: Remaining requests in the current window.
          schema: { type: integer, minimum: 0 }
        RateLimit-Reset:
          description: Unix timestamp when the current rate limit window resets.
          schema: { type: integer, minimum: 0 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    Role:
      type: string
      enum: [OWNER, ADMIN, MEMBER, VIEWER]
    CurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"
      examples: [USD, CNY]
    DecimalString:
      type: string
      pattern: '^-?\d+(\.\d+)?$'
    FxRateString:
      type: string
      pattern: '^\d+(\.\d{1,12})?$'
    FxPolicy:
      type: string
      enum:
        [
          LOCK_AT_EXPENSE_DATE,
          ORIGINAL_CURRENCY_DEBT,
          MANUAL_RATE_WITH_APPROVAL,
          FX_DIFFERENCE_ADJUSTMENT,
        ]
    HouseholdFxPolicySetting:
      type: string
      description: Currently supported household FX policies for proposal creation. Original-currency debt and FX-difference adjustment remain backlog policies and are not accepted in settings yet.
      enum: [LOCK_AT_EXPENSE_DATE, MANUAL_RATE_WITH_APPROVAL]
    ApprovalPolicy:
      type: string
      enum: [PAYER_AND_EACH_DEBTOR, ALL_PARTICIPANTS, PAYER_ONLY]
    ClearingPolicy:
      type: string
      enum: [DIRECT_ONLY, HOUSEHOLD_NETTING]
    ApprovalDecision:
      type: string
      enum: [APPROVED, REJECTED, REQUEST_CHANGES]
    SplitMethod:
      type: string
      enum: [EQUAL, EXACT, PERCENTAGE, SHARES, ADJUSTMENT]
    CreateExpenseSplitMethod:
      type: string
      enum: [EQUAL, EXACT, PERCENTAGE, SHARES]
    ExpenseProposalStatus:
      type: string
      enum:
        [
          DRAFT,
          SUBMITTED,
          PARTIALLY_APPROVED,
          APPROVED,
          PARTIALLY_MATURED,
          MATURED_TO_LEDGER,
          REJECTED,
          DISPUTED,
          CANCELLED,
        ]
    ShareStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, DISPUTED, MATURED_TO_LEDGER]
    LedgerTransactionType:
      type: string
      enum: [DEBT_CREATED, SETTLEMENT_RECORDED, REVERSAL, ADJUSTMENT, FX_ADJUSTMENT]
    DebtStatus:
      type: string
      enum: [OPEN, SETTLED, REVERSED]
    SettlementStatus:
      type: string
      enum: [SUBMITTED, CONFIRMED, REJECTED, CANCELLED]
    LedgerPeriodStatus:
      type: string
      enum: [CLOSED, REOPENED]
    CalendarEventType:
      type: string
      enum:
        [
          TASK,
          CHORE,
          GROUP_ACTIVITY,
          BILL_DUE,
          REPAYMENT_DUE,
          SETTLEMENT_REMINDER,
          RECURRING_EXPENSE_GENERATION,
        ]
    WorkItemStatus:
      type: string
      enum: [OPEN, COMPLETED]
    TaskPriority:
      type: string
      enum: [LOW, NORMAL, HIGH]
    RecurrenceFrequency:
      type: string
      enum: [NONE, DAILY, WEEKLY, MONTHLY]
    AuditEvent:
      type: object
      required: [id, householdId, action, entityType, entityId, occurredAt]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        actorUserId: { type: string, format: uuid, nullable: true }
        action: { type: string, example: expense_proposal.submitted }
        entityType: { type: string, example: ExpenseProposal }
        entityId: { type: string, format: uuid }
        before:
          type: object
          additionalProperties: true
          nullable: true
        after:
          type: object
          additionalProperties: true
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        prevHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          nullable: true
        eventHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          nullable: true
        occurredAt: { type: string, format: date-time }
    AuditHashChain:
      type: object
      required: [status, eventCount, hashedEventCount, brokenEventId, latestEventHash]
      properties:
        status:
          type: string
          enum: [VERIFIED, MISSING_HASHES, BROKEN]
        eventCount: { type: integer, minimum: 0 }
        hashedEventCount: { type: integer, minimum: 0 }
        brokenEventId: { type: string, format: uuid, nullable: true }
        latestEventHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          nullable: true
    AuditEventListResponse:
      type: object
      required: [events, chain, page]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        chain: { $ref: "#/components/schemas/AuditHashChain" }
        page: { $ref: "#/components/schemas/PageInfo" }
    AmountTotal:
      type: object
      required: [currency, amount]
      properties:
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        amount: { $ref: "#/components/schemas/DecimalString" }
    StatsProposalCounts:
      type: object
      required:
        [
          DRAFT,
          SUBMITTED,
          PARTIALLY_APPROVED,
          APPROVED,
          PARTIALLY_MATURED,
          MATURED_TO_LEDGER,
          REJECTED,
          DISPUTED,
          CANCELLED,
        ]
      properties:
        DRAFT: { type: integer, minimum: 0 }
        SUBMITTED: { type: integer, minimum: 0 }
        PARTIALLY_APPROVED: { type: integer, minimum: 0 }
        APPROVED: { type: integer, minimum: 0 }
        PARTIALLY_MATURED: { type: integer, minimum: 0 }
        MATURED_TO_LEDGER: { type: integer, minimum: 0 }
        REJECTED: { type: integer, minimum: 0 }
        DISPUTED: { type: integer, minimum: 0 }
        CANCELLED: { type: integer, minimum: 0 }
    StatsTaskCounts:
      type: object
      required: [open, completed]
      properties:
        open: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
    StatsWindow:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date
          nullable: true
          description: Inclusive start date for the selected statistics window.
        to:
          type: string
          format: date
          nullable: true
          description: Inclusive end date for the selected statistics window.
    StatsProposalTrendPoint:
      type: object
      required: [date, proposalCount, proposalTotals]
      properties:
        date: { type: string, format: date }
        proposalCount: { type: integer, minimum: 0 }
        proposalTotals:
          type: array
          items: { $ref: "#/components/schemas/AmountTotal" }
    ExportDataset:
      type: string
      enum: [expense_proposals, ledger_obligations, settlements, audit_events, members]
    ExportFormat:
      type: string
      enum: [json, csv]
    CreateExportRequest:
      type: object
      required: [dataset, format]
      properties:
        dataset: { $ref: "#/components/schemas/ExportDataset" }
        format: { $ref: "#/components/schemas/ExportFormat" }
    HouseholdExport:
      type: object
      required: [id, householdId, dataset, format, status, createdAt, expiresAt, downloadUrl]
      properties:
        id:
          type: string
          description: Signed short-lived export download identifier.
        householdId: { type: string, format: uuid }
        dataset: { $ref: "#/components/schemas/ExportDataset" }
        format: { $ref: "#/components/schemas/ExportFormat" }
        status:
          type: string
          enum: [READY]
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        downloadUrl: { type: string }
    ExportResponse:
      type: object
      required: [export]
      properties:
        export: { $ref: "#/components/schemas/HouseholdExport" }
    StatsSummary:
      type: object
      required:
        [
          householdId,
          window,
          settlementCurrency,
          proposalCounts,
          proposalSettlementTotals,
          openObligationTotals,
          confirmedSettlementTotals,
          taskCounts,
          proposalTrend,
          auditEventCount,
          receiptFileCount,
        ]
      properties:
        householdId: { type: string, format: uuid }
        window: { $ref: "#/components/schemas/StatsWindow" }
        settlementCurrency: { $ref: "#/components/schemas/CurrencyCode" }
        proposalCounts: { $ref: "#/components/schemas/StatsProposalCounts" }
        proposalSettlementTotals:
          type: array
          items: { $ref: "#/components/schemas/AmountTotal" }
        openObligationTotals:
          type: array
          items: { $ref: "#/components/schemas/AmountTotal" }
        confirmedSettlementTotals:
          type: array
          items: { $ref: "#/components/schemas/AmountTotal" }
        taskCounts: { $ref: "#/components/schemas/StatsTaskCounts" }
        proposalTrend:
          type: array
          description: Non-cancelled proposal volume grouped by expense date within the selected window.
          items: { $ref: "#/components/schemas/StatsProposalTrendPoint" }
        auditEventCount: { type: integer, minimum: 0 }
        receiptFileCount: { type: integer, minimum: 0 }
    StatsSummaryResponse:
      type: object
      required: [summary]
      properties:
        summary: { $ref: "#/components/schemas/StatsSummary" }
    CategoryStat:
      type: object
      required:
        [
          categoryId,
          categoryKey,
          nameEn,
          nameZhCn,
          proposalCount,
          proposalTotals,
          maturedShareTotals,
        ]
      properties:
        categoryId: { type: string, format: uuid, nullable: true }
        categoryKey: { type: string }
        nameEn: { type: string }
        nameZhCn: { type: string }
        proposalCount: { type: integer, minimum: 0 }
        proposalTotals:
          type: array
          items: { $ref: "#/components/schemas/AmountTotal" }
        maturedShareTotals:
          type: array
          items: { $ref: "#/components/schemas/AmountTotal" }
    CategoryStatsListResponse:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/CategoryStat" }
    MemberStat:
      type: object
      required:
        [
          userId,
          displayName,
          email,
          role,
          createdProposalCount,
          createdProposalTotals,
          paidProposalTotals,
          owedObligationTotals,
          receivableObligationTotals,
          remainingOwedTotals,
          remainingReceivableTotals,
          confirmedSettlementPaidTotals,
          confirmedSettlementReceivedTotals,
        ]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        createdProposalCount: { type: integer, minimum: 0 }
        createdProposalTotals:
          type: array
          items: { $ref: "#/components/schemas/AmountTotal" }
        paidProposalTotals:
          type: array
          items: { $ref: "#/components/schemas/AmountTotal" }
        owedObligationTotals:
          type: array
          items: { $ref: "#/components/schemas/AmountTotal" }
        receivableObligationTotals:
          type: array
          items: { $ref: "#/components/schemas/AmountTotal" }
        remainingOwedTotals:
          type: array
          items: { $ref: "#/components/schemas/AmountTotal" }
        remainingReceivableTotals:
          type: array
          items: { $ref: "#/components/schemas/AmountTotal" }
        confirmedSettlementPaidTotals:
          type: array
          items: { $ref: "#/components/schemas/AmountTotal" }
        confirmedSettlementReceivedTotals:
          type: array
          items: { $ref: "#/components/schemas/AmountTotal" }
    MemberStatsListResponse:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/MemberStat" }
    User:
      type: object
      required: [id, email, displayName, preferredLocale, notificationPreferences]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        preferredLocale: { type: string, enum: [zh-CN, en-US] }
        notificationPreferences: { $ref: "#/components/schemas/NotificationPreferences" }
    NotificationPreferences:
      type: object
      required:
        [
          inAppEnabled,
          emailEnabled,
          proposalUpdatesEnabled,
          settlementUpdatesEnabled,
          taskRemindersEnabled,
        ]
      properties:
        inAppEnabled: { type: boolean }
        emailEnabled: { type: boolean }
        proposalUpdatesEnabled: { type: boolean }
        settlementUpdatesEnabled: { type: boolean }
        taskRemindersEnabled: { type: boolean }
    UpdateCurrentUserRequest:
      type: object
      required: [displayName, preferredLocale, notificationPreferences]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        preferredLocale: { type: string, enum: [zh-CN, en-US] }
        notificationPreferences: { $ref: "#/components/schemas/NotificationPreferences" }
    CurrentUserResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
    UpdateSessionRequest:
      type: object
      required: [activeHouseholdId]
      properties:
        activeHouseholdId: { type: string, format: uuid }
    SessionResponse:
      type: object
      required: [user, household]
      properties:
        user: { $ref: "#/components/schemas/User" }
        household:
          allOf:
            - { $ref: "#/components/schemas/HouseholdMembershipSummary" }
          nullable: true
    Notification:
      type: object
      required: [id, householdId, type, titleKey, bodyKey, payload, readAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        type:
          type: string
          enum:
            [
              EXPENSE_PROPOSAL_ASSIGNED,
              TASK_DUE_SOON,
              TASK_OVERDUE,
              DEBT_DUE_SOON,
              DEBT_OVERDUE,
              SETTLEMENT_CONFIRMATION_REMINDER,
            ]
        titleKey: { type: string }
        bodyKey: { type: string }
        payload:
          type: object
          additionalProperties: true
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }
    PageInfo:
      type: object
      required: [limit, nextCursor, hasMore]
      properties:
        limit: { type: integer, minimum: 1, maximum: 100 }
        nextCursor:
          type: string
          format: uuid
          nullable: true
        hasMore: { type: boolean }
    NotificationsListResponse:
      type: object
      required: [notifications, unreadCount, page]
      properties:
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        unreadCount: { type: integer, minimum: 0 }
        page: { $ref: "#/components/schemas/PageInfo" }
    UpdateNotificationRequest:
      type: object
      required: [read]
      properties:
        read: { type: boolean }
    NotificationResponse:
      type: object
      required: [notification]
      properties:
        notification: { $ref: "#/components/schemas/Notification" }
    PushSubscriptionSettingsResponse:
      type: object
      required: [configured, publicKey, deliveryMode, activeSubscriptionCount]
      properties:
        configured: { type: boolean }
        publicKey:
          type: string
          nullable: true
          description: VAPID public key for browser PushManager subscription.
        deliveryMode:
          type: string
          enum: [send, dry-run, disabled]
        activeSubscriptionCount: { type: integer, minimum: 0 }
    PushSubscriptionRequest:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri, maxLength: 2048 }
        expirationTime:
          type: integer
          nullable: true
          description: Browser PushSubscription expiration time in milliseconds since epoch.
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, minLength: 16, maxLength: 512 }
            auth: { type: string, minLength: 8, maxLength: 512 }
    PushSubscription:
      type: object
      required: [id, endpoint, active]
      properties:
        id: { type: string, format: uuid }
        endpoint: { type: string, format: uri }
        active: { type: boolean }
    PushSubscriptionResponse:
      type: object
      required: [subscription]
      properties:
        subscription: { $ref: "#/components/schemas/PushSubscription" }
    DeletePushSubscriptionRequest:
      type: object
      required: [endpoint]
      properties:
        endpoint: { type: string, format: uri, maxLength: 2048 }
    DeletePushSubscriptionResponse:
      type: object
      required: [disabledCount]
      properties:
        disabledCount: { type: integer, minimum: 0 }
    Household:
      type: object
      required:
        [
          id,
          name,
          timezone,
          settlementCurrency,
          defaultLocale,
          fxPolicy,
          approvalPolicy,
          clearingPolicy,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string, example: America/Los_Angeles }
        settlementCurrency: { $ref: "#/components/schemas/CurrencyCode" }
        defaultLocale: { type: string, enum: [zh-CN, en-US] }
        fxPolicy: { $ref: "#/components/schemas/FxPolicy" }
        approvalPolicy: { $ref: "#/components/schemas/ApprovalPolicy" }
        clearingPolicy: { $ref: "#/components/schemas/ClearingPolicy" }
    HouseholdMembershipSummary:
      type: object
      required:
        [
          id,
          name,
          timezone,
          settlementCurrency,
          defaultLocale,
          fxPolicy,
          approvalPolicy,
          clearingPolicy,
          role,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string, example: America/Los_Angeles }
        settlementCurrency: { $ref: "#/components/schemas/CurrencyCode" }
        defaultLocale: { type: string, enum: [zh-CN, en-US] }
        fxPolicy: { $ref: "#/components/schemas/FxPolicy" }
        approvalPolicy: { $ref: "#/components/schemas/ApprovalPolicy" }
        clearingPolicy: { $ref: "#/components/schemas/ClearingPolicy" }
        role: { $ref: "#/components/schemas/Role" }
    CreateHouseholdRequest:
      type: object
      required: [name, timezone, settlementCurrency]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        timezone: { type: string, example: America/Los_Angeles }
        settlementCurrency: { $ref: "#/components/schemas/CurrencyCode" }
        defaultLocale: { type: string, enum: [zh-CN, en-US] }
    UpdateHouseholdRequest:
      type: object
      required:
        [
          name,
          timezone,
          settlementCurrency,
          defaultLocale,
          fxPolicy,
          approvalPolicy,
          clearingPolicy,
        ]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        timezone: { type: string, example: America/Los_Angeles }
        settlementCurrency: { $ref: "#/components/schemas/CurrencyCode" }
        defaultLocale: { type: string, enum: [zh-CN, en-US] }
        fxPolicy: { $ref: "#/components/schemas/HouseholdFxPolicySetting" }
        approvalPolicy: { $ref: "#/components/schemas/ApprovalPolicy" }
        clearingPolicy: { $ref: "#/components/schemas/ClearingPolicy" }
    ExpenseCategory:
      type: object
      required: [id, key, nameEn, nameZhCn, icon, colorToken, sortOrder, isActive]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        nameEn: { type: string }
        nameZhCn: { type: string }
        icon:
          type: string
          nullable: true
        colorToken:
          type: string
          nullable: true
        sortOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
    ExpenseCategoryInput:
      type: object
      required: [nameEn, nameZhCn]
      properties:
        nameEn: { type: string, minLength: 2, maxLength: 80 }
        nameZhCn: { type: string, minLength: 1, maxLength: 80 }
        icon: { type: string, maxLength: 80 }
        colorToken: { type: string, maxLength: 80 }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    ExpenseCategoryListResponse:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/ExpenseCategory" }
    ExpenseCategoryResponse:
      type: object
      required: [category]
      properties:
        category: { $ref: "#/components/schemas/ExpenseCategory" }
    ExpenseTag:
      type: object
      required: [id, name, colorToken, sortOrder, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        colorToken:
          type: string
          nullable: true
        sortOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
    ExpenseTagInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        colorToken: { type: string, maxLength: 80 }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    ExpenseTagListResponse:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items: { $ref: "#/components/schemas/ExpenseTag" }
    ExpenseTagResponse:
      type: object
      required: [tag]
      properties:
        tag: { $ref: "#/components/schemas/ExpenseTag" }
    Member:
      type: object
      required: [id, userId, role, displayName]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        displayName: { type: string }
        email: { type: string, format: email }
    CreateInviteRequest:
      type: object
      required: [role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, MEMBER, VIEWER] }
    UpdateMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [ADMIN, MEMBER, VIEWER] }
    TransferOwnershipResponse:
      type: object
      required: [previousOwner, nextOwner]
      properties:
        previousOwner: { $ref: "#/components/schemas/Member" }
        nextOwner: { $ref: "#/components/schemas/Member" }
    Invite:
      type: object
      required: [id, role, expiresAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, nullable: true }
        role: { type: string, enum: [ADMIN, MEMBER, VIEWER] }
        expiresAt: { type: string, format: date-time }
    AcceptInviteRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    DevSessionRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        displayName: { type: string }
    ExpensePayerInput:
      type: object
      required: [userId, amountOriginal]
      properties:
        userId: { type: string, format: uuid }
        amountOriginal: { $ref: "#/components/schemas/DecimalString" }
    ExpenseParticipantInput:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
        exactAmountOriginal:
          description: Required for each debtor when splitMethod is EXACT. Debtor exact amounts must not exceed the original amount; the payer's remainder is implicit.
          $ref: "#/components/schemas/DecimalString"
        percentage:
          description: Required for each debtor when splitMethod is PERCENTAGE. Debtor percentages must not exceed 100; the payer's remainder is implicit.
          $ref: "#/components/schemas/DecimalString"
        shareUnits:
