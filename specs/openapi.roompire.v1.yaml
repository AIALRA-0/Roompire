          type: string
          format: uuid
          description: Creditor receiving the suggested transfer.
        amount:
          allOf:
            - { $ref: "#/components/schemas/DecimalString" }
          description: Positive amount, up to six decimal places, not exceeding matching open obligations for the payer, payee, and currency.
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        settlementDate: { type: string, format: date }
        method: { type: string, minLength: 1, maxLength: 60, default: manual }
        paymentReference: { type: string, maxLength: 160 }
        note: { type: string, maxLength: 500 }
        fileIds:
          type: array
          description: Optional completed upload IDs to attach as settlement evidence. Files must belong to the household and be uploaded by the submitting user.
