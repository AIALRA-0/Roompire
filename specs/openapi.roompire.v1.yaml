              nullable: true
        housekeepingService:
          type: object
          required:
            [name, activeState, result, execMainStatus, startedAt, finishedAt, status, error]
          properties:
            name: { type: string, example: roompire-housekeeping.service }
            activeState: { type: string, example: inactive }
            result: { type: string, example: success }
            execMainStatus: { type: string, example: "0" }
            startedAt:
              type: string
              nullable: true
            finishedAt:
              type: string
              nullable: true
            status: { $ref: "#/components/schemas/OpsHealthState" }
            error:
              type: string
              nullable: true
        backupEncryption:
          type: object
          required:
            [
              backupRoot,
              configured,
              passphraseFileConfigured,
              passphraseFileExists,
              encryptedArtifacts,
              plaintextArtifacts,
              missingSha256Sidecars,
              latestEncryptedArtifact,
              status,
              checkedAt,
              error,
            ]
          properties:
            backupRoot: { type: string, example: /srv/aialra/backups/roompire }
            configured: { $ref: "#/components/schemas/OpsBackupEncryptionMode" }
            passphraseFileConfigured: { type: boolean }
            passphraseFileExists:
              type: boolean
              nullable: true
            encryptedArtifacts: { type: integer }
            plaintextArtifacts: { type: integer }
            missingSha256Sidecars: { type: integer }
            latestEncryptedArtifact:
              type: string
              nullable: true
            status: { $ref: "#/components/schemas/OpsHealthState" }
            checkedAt:
              type: string
              format: date-time
              nullable: true
            error:
              type: string
              nullable: true
        backupOffsite:
          type: object
          required:
            [
              mode,
              configured,
              targetConfigured,
              target,
              statusFile,
              lastSyncAt,
              artifactCount,
              totalBytes,
              latestArtifact,
              status,
              checkedAt,
              error,
            ]
          properties:
            mode: { $ref: "#/components/schemas/OpsBackupOffsiteMode" }
            configured: { type: boolean }
            targetConfigured: { type: boolean }
            target:
              type: string
              nullable: true
              example: local:/mnt/roompire-offsite
            statusFile:
              type: string
              example: ops/status/backup-offsite.json
            lastSyncAt:
              type: string
              format: date-time
              nullable: true
            artifactCount: { type: integer }
            totalBytes: { type: integer }
            latestArtifact:
              type: string
              nullable: true
            status: { $ref: "#/components/schemas/OpsHealthState" }
            checkedAt:
              type: string
              format: date-time
              nullable: true
            error:
              type: string
              nullable: true
        smokeTimer:
          type: object
          required: [name, activeState, enabledState, nextElapse, lastTrigger, status, error]
          properties:
            name: { type: string, example: roompire-smoke.timer }
            activeState: { type: string, example: active }
            enabledState: { type: string, example: enabled }
            nextElapse:
              type: string
              nullable: true
            lastTrigger:
              type: string
              nullable: true
            status: { $ref: "#/components/schemas/OpsHealthState" }
            error:
              type: string
              nullable: true
        smokeService:
          type: object
          required:
            [name, activeState, result, execMainStatus, startedAt, finishedAt, status, error]
          properties:
            name: { type: string, example: roompire-smoke.service }
            activeState: { type: string, example: inactive }
            result: { type: string, example: success }
            execMainStatus: { type: string, example: "0" }
            startedAt:
              type: string
              nullable: true
            finishedAt:
              type: string
              nullable: true
            status: { $ref: "#/components/schemas/OpsHealthState" }
            error:
              type: string
              nullable: true
        latestSmoke:
          type: object
          required: [status, generatedAt, baseUrl, checks, failedPath, message]
          properties:
            status: { $ref: "#/components/schemas/OpsSmokeState" }
            generatedAt:
              type: string
              format: date-time
              nullable: true
            baseUrl:
              type: string
              nullable: true
            checks:
              type: array
              items: { $ref: "#/components/schemas/OpsSmokeCheck" }
            failedPath:
              type: string
              nullable: true
            message:
              type: string
              nullable: true
        latestRestoreDrill:
          type: object
          required:
            [
              status,
              generatedAt,
              backupFile,
              drillDatabase,
              auditTotal,
              auditHashed,
              auditBroken,
              message,
            ]
          properties:
            status: { $ref: "#/components/schemas/OpsRestoreDrillState" }
            generatedAt:
              type: string
              format: date-time
              nullable: true
            backupFile:
              type: string
              nullable: true
              example: /srv/aialra/backups/roompire/postgres/roompire_20260706T041700Z.dump.enc
            drillDatabase:
              type: string
              nullable: true
              example: roompire_restore_drill_20260706T041702Z_1234
            auditTotal:
              type: integer
              nullable: true
            auditHashed:
              type: integer
              nullable: true
            auditBroken:
              type: integer
              nullable: true
            message:
              type: string
              nullable: true
    OpsStatusResponse:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/OpsStatusSnapshot" }
    HealthResponse:
      type: object
      required: [status, checks, timestamp, durationMs]
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
        checks:
          type: object
          required: [database, exports, fx, storage, webPush]
          properties:
            database: { type: string, enum: [ok, error] }
            exports: { type: string, enum: [ok, error] }
            fx: { type: string, enum: [ok, error] }
            storage: { type: string, enum: [ok, error] }
            webPush: { type: string, enum: [ok, disabled, error] }
        timestamp: { type: string, format: date-time }
        durationMs: { type: integer, minimum: 0 }
paths:
  /session:
    get:
      summary: Get current session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      summary: Set active household for the current browser session
      description: Stores the selected active household in a secure session cookie after verifying the current user is an active member.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSessionRequest" }
      responses:
        "200":
          description: Active household updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Household not found or inaccessible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /users/me:
    get:
      summary: Get current user profile and notification preferences
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUserResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      summary: Update current user profile and notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCurrentUserRequest" }
      responses:
        "200":
          description: User settings updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUserResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /notifications:
    get:
      summary: List current user's in-app notifications
      description: Returns cursor-paginated notifications for households where the current user is still an active member.
      parameters:
        - in: query
          name: cursor
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationsListResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /notifications/push-subscriptions:
    get:
      summary: Get browser push subscription settings
      description: Returns whether Web Push is configured, the VAPID public key when enabled, delivery mode, and the current user's active subscription count.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushSubscriptionSettingsResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      summary: Register or refresh a browser push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscriptionRequest" }
      responses:
        "201":
          description: Subscription saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushSubscriptionResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403": { $ref: "#/components/responses/CsrfForbidden" }
        "503":
          description: Web Push is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      summary: Disable a browser push subscription for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeletePushSubscriptionRequest" }
      responses:
        "200":
          description: Subscription disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletePushSubscriptionResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403": { $ref: "#/components/responses/CsrfForbidden" }
  /notifications/{notificationId}:
    patch:
      summary: Mark a current user's notification read or unread
      parameters:
        - in: path
          name: notificationId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNotificationRequest" }
      responses:
        "200":
          description: Notification updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Notification not found or inaccessible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /dev/session:
    post:
      summary: Set local developer session user
      description: Dev-only endpoint for local MVP testing. Disabled in production unless explicitly enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DevSessionRequest" }
      responses:
        "200": { description: Developer session set }
        "429": { $ref: "#/components/responses/RateLimited" }
  /health:
    get:
      summary: Get application health
      description: Returns app dependency health, including database, storage, export signing, FX provider configuration, and optional Web Push configuration.
      responses:
        "200":
          description: Healthy or optional delivery channels disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: Required dependency or configured optional channel is unhealthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
  /ops/status:
    get:
      summary: Get server ops health
      description: Returns the latest host-generated operational snapshot for the self-hosted deployment. Only the configured site-gate owner or household owners/admins may read it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpsStatusResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller is not allowed to view ops health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households:
    get:
      summary: List current user's households
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [households]
                properties:
                  households:
                    type: array
                    items: { $ref: "#/components/schemas/HouseholdMembershipSummary" }
    post:
      summary: Create household
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateHouseholdRequest" }
      responses:
        "201":
          description: Created
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}:
    patch:
      summary: Update household settings
      description: Owners and admins can update household locale, timezone, currency, FX, and approval policy.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateHouseholdRequest" }
      responses:
        "200":
          description: Household settings updated
          content:
            application/json:
              schema:
                type: object
                required: [household]
                properties:
                  household: { $ref: "#/components/schemas/Household" }
        "403":
          description: Caller is not owner/admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found or inaccessible household
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/categories:
    get:
      summary: List household expense categories
      description: Active household members can read the active category set used by expense, task, and calendar proposal flows.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseCategoryListResponse" }
        "404":
          description: Household not found or caller is not an active member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      summary: Create household expense category
      description: Owners and admins can create active household categories. The server generates a stable category key and audit event.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseCategoryInput" }
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseCategoryResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller is not owner/admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Household not found or caller is not an active member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/categories/{categoryId}:
    patch:
      summary: Update household expense category
      description: Owners and admins can rename or reorder active household categories without changing the stable category key used in stats and history.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: categoryId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseCategoryInput" }
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseCategoryResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller is not owner/admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Category not found or inaccessible household
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      summary: Archive household expense category
      description: Owners and admins can archive active categories. Historical proposals keep their category reference, while new proposal flows only list active categories.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: categoryId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Category archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseCategoryResponse" }
        "403":
          description: Caller is not owner/admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Category not found or inaccessible household
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/tags:
    get:
      summary: List household expense tags
      description: Active household members can read the active tag set used by expense proposal flows.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseTagListResponse" }
        "404":
          description: Household not found or caller is not an active member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      summary: Create household expense tag
      description: Owners and admins can create active household tags for lightweight proposal grouping.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseTagInput" }
      responses:
        "201":
          description: Tag created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseTagResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller is not owner/admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Household not found or caller is not an active member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: A tag with this name already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/tags/{tagId}:
    patch:
      summary: Update household expense tag
      description: Owners and admins can rename, recolor, or reorder active household tags.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: tagId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseTagInput" }
      responses:
        "200":
          description: Tag updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseTagResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller is not owner/admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Tag not found or inaccessible household
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: A tag with this name already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      summary: Archive household expense tag
      description: Owners and admins can archive active tags. Historical proposals keep tag links, while new proposal flows only list active tags.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: tagId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Tag archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseTagResponse" }
        "403":
          description: Caller is not owner/admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Tag not found or inaccessible household
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/members:
    get:
      summary: List household members
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "404":
          description: Not found or inaccessible household
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/members/{membershipId}:
    patch:
      summary: Update household member role
      description: Owners can update non-self member roles; admins can manage regular members and viewers.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: membershipId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMemberRoleRequest" }
      responses:
        "200":
          description: Member role updated
          content:
            application/json:
              schema:
                type: object
                required: [membership]
                properties:
                  membership: { $ref: "#/components/schemas/Member" }
        "400":
          description: Invalid role change, self-mutation, or last-owner guard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller cannot manage the target member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Member not found or inaccessible household
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      summary: Remove household member
      description: Owners can remove non-self members; admins can remove regular members and viewers.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: membershipId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                required: [membership]
                properties:
                  membership: { $ref: "#/components/schemas/Member" }
        "400":
          description: Self-removal or last-owner guard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller cannot manage the target member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Member not found or inaccessible household
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/members/{membershipId}/transfer-ownership:
    post:
      summary: Transfer household ownership
      description: Current owners can promote another active household member to owner; the transferring owner becomes an admin.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: membershipId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Ownership transferred
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferOwnershipResponse" }
        "400":
          description: Self-transfer or target is already an owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller is not an owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Member not found or inaccessible household
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/invites:
    post:
      summary: Create household invite
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInviteRequest" }
      responses:
        "201":
          description: Invite created; token is returned once.
          content:
            application/json:
              schema:
                type: object
                required: [invite, token]
                properties:
                  invite: { $ref: "#/components/schemas/Invite" }
                  token: { type: string }
        "403":
          description: Caller is not owner/admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found or inaccessible household
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /invites/accept:
    post:
      summary: Accept an invite code as the current user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInviteRequest" }
      responses:
        "200": { description: Invite accepted }
        "404":
          description: Invalid or expired invite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /households/{householdId}/expenses/proposals:
    get:
      summary: List expense proposals
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: q
          description: Case-insensitive search across proposal title, merchant, and description.
          schema: { type: string, minLength: 1, maxLength: 120 }
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/ExpenseProposalStatus" }
        - in: query
          name: categoryId
          schema: { type: string, format: uuid }
        - in: query
          name: tagId
          schema: { type: string, format: uuid }
        - in: query
          name: memberUserId
          description: Matches proposals created by, paid by, owed by, or owed to this active household member.
          schema: { type: string, format: uuid }
        - in: query
          name: from
          description: Inclusive expense date lower bound.
          schema: { type: string, format: date }
        - in: query
          name: to
          description: Inclusive expense date upper bound.
          schema: { type: string, format: date }
        - in: query
          name: minAmount
          description: Inclusive visible amount lower bound; matches either originalAmount or settlementAmount.
          schema: { $ref: "#/components/schemas/DecimalString" }
        - in: query
          name: maxAmount
          description: Inclusive visible amount upper bound; matches either originalAmount or settlementAmount.
          schema: { $ref: "#/components/schemas/DecimalString" }
        - in: query
          name: cursor
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseProposalListResponse" }
        "404":
          description: Not found or inaccessible household
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      summary: Create expense proposal
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Replays the stored response for the same user, key, endpoint, and request body. Reusing the key with a different request returns 409.
          schema: { type: string, maxLength: 160 }
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExpenseProposalRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseProposalResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller is a viewer or otherwise cannot create proposals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found or inaccessible household
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Idempotency-Key is already in progress or was reused with a different request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/expenses/proposals/{proposalId}:
    get:
      summary: Get expense proposal detail
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: proposalId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseProposalResponse" }
        "404":
          description: Not found or inaccessible proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/expenses/proposals/{proposalId}/submit:
    post:
      summary: Submit a draft proposal for approval
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 160 }
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: proposalId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Submitted }
  /households/{householdId}/expenses/proposals/{proposalId}/comments:
    post:
      summary: Add a comment to an expense proposal
      description: Owners, admins, and members can add proposal comments. Viewers can read proposal detail but cannot comment. Matching duplicate Idempotency-Key requests replay the stored proposal response.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Replays the stored response for the same user, key, endpoint, and request body. Reusing the key with a different request returns 409.
          schema: { type: string, maxLength: 160 }
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: proposalId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProposalCommentRequest" }
      responses:
        "201":
          description: Comment added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseProposalResponse" }
        "400":
          description: Validation error, invalid shareId, or missing Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller is a viewer or otherwise cannot comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found or inaccessible proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Idempotent request is in progress or the Idempotency-Key was reused with a different request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /households/{householdId}/expenses/proposals/{proposalId}/revisions:
    post:
      summary: Submit a revised expense proposal
      description: The original proposal creator can revise a disputed or rejected proposal that has not created ledger obligations. The old proposal is cancelled, the new proposal is submitted with an incremented revisionNumber and supersedesProposalId, and duplicate matching Idempotency-Key requests replay the stored proposal response.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Replays the stored response for the same user, key, endpoint, and request body. Reusing the key with a different request returns 409.
          schema: { type: string, maxLength: 160 }
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: proposalId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExpenseProposalRevisionRequest" }
      responses:
        "201":
          description: Revised proposal submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseProposalResponse" }
        "400":
          description: Validation error or missing Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller is not the original proposal creator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found or inaccessible proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Proposal is not revisionable, has ledger obligations, already has a newer revision, or Idempotency-Key was reused with a different request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/expenses/shares/{shareId}/approve:
    post:
      summary: Approve own assigned expense share and mature it to the ledger
      description: The assigned debtor approves their share. When maturity creates a DebtObligation with a due date, the service also creates a linked REPAYMENT_DUE calendar event.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Replays the stored response for the same user, key, endpoint, and request body. Reusing the key with a different request returns 409.
          schema: { type: string, maxLength: 160 }
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: shareId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveExpenseShareRequest" }
      responses:
        "200":
          description: Approved and matured when eligible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseProposalResponse" }
        "400":
          description: Validation error or missing Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller is not the assigned debtor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found or inaccessible share
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Share/proposal is no longer actionable, ledger period is closed, the idempotent request is in progress, or the Idempotency-Key was reused with a different request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /households/{householdId}/expenses/shares/{shareId}/reject:
    post:
      summary: Reject own assigned expense share
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Replays the stored response for the same user, key, endpoint, and request body. Reusing the key with a different request returns 409.
          schema: { type: string, maxLength: 160 }
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: shareId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectExpenseShareRequest" }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseProposalResponse" }
        "400":
          description: Validation error or missing Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller is not the assigned debtor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found or inaccessible share
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Share/proposal is no longer actionable, the idempotent request is in progress, or the Idempotency-Key was reused with a different request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /households/{householdId}/expenses/shares/{shareId}/request-changes:
    post:
      summary: Request changes for own assigned expense share
      description: The assigned debtor can move their pending share to DISPUTED and the proposal to DISPUTED without creating formal ledger obligations. The creator can then submit a revised proposal.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Replays the stored response for the same user, key, endpoint, and request body. Reusing the key with a different request returns 409.
          schema: { type: string, maxLength: 160 }
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: shareId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestChangesExpenseShareRequest" }
      responses:
        "200":
          description: Changes requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseProposalResponse" }
        "400":
          description: Validation error or missing Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller is not the assigned debtor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found or inaccessible share
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Share/proposal is no longer actionable, the idempotent request is in progress, or the Idempotency-Key was reused with a different request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /households/{householdId}/files/presign-upload:
    post:
      summary: Create a private file upload intent
      description: Owners, admins, and members can request a local/private upload URL for receipt or evidence files. Current MVP accepts PDF and common image types up to 5 MB.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresignFileUploadRequest" }
      responses:
        "201":
          description: Upload intent created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresignFileUploadResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller is a viewer or otherwise cannot upload files
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /households/{householdId}/files/{fileId}/upload:
    put:
      summary: Upload file bytes for a private file intent
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: fileId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: File bytes stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileResponse" }
        "400":
          description: MIME type or size mismatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller is not the uploader or cannot upload files
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: File intent not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/files/complete-upload:
    post:
      summary: Finalize a private upload and optionally attach it to a proposal
      description: Completes an uploaded private file. When `proposalId` is supplied, owners/admins/members attach the file to that proposal and the proposal detail timeline includes the receipt attachment event.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Replays the stored response for the same user, key, endpoint, and request body. Reusing the key with a different request returns 409.
          schema: { type: string, maxLength: 160 }
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteFileUploadRequest" }
      responses:
        "200":
          description: File upload completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileResponse" }
        "400":
          description: Validation error or missing Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller is not the uploader or cannot complete files
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: File or proposal not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: File bytes are not uploaded yet or Idempotency-Key was reused with a different request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/files/{fileId}/download-url:
    get:
      summary: Get a short-lived private file download URL
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: fileId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Signed download URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileDownloadUrlResponse" }
        "404":
          description: File not found or inaccessible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/balances:
    get:
      summary: Get formal ledger balances only
      description: Derived from open debt obligations and settlement allocations; pending or rejected proposals are excluded.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceListResponse" }
        "404":
          description: Household not found or caller is not an active member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/ledger/obligations:
    get:
      summary: List formal ledger obligations
      description: Returns append-only debt obligations created from approved shares, ordered newest first.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/DebtStatus" }
        - in: query
          name: cursor
          schema: { type: string, format: uuid }
          description: Cursor returned from the previous obligation page.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerObligationListResponse" }
        "404":
          description: Household not found or caller is not an active member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/ledger/transactions:
    get:
      summary: List formal ledger transactions
      description: Returns append-only ledger effects with nested obligations and settlements, ordered newest first.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          schema: { type: string, format: uuid }
          description: Cursor returned from the previous transaction page.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerTransactionListResponse" }
        "404":
          description: Household not found or caller is not an active member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/ledger/period-closes:
    get:
      summary: List ledger period closes
      description: Returns the latest month close/reopen states for the household. Active members can read; only owners and admins can mutate.
      parameters:
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerPeriodCloseListResponse" }
        "404":
          description: Household not found or caller is not an active member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      summary: Close a ledger month
      description: Owners and admins can close a month. A closed period blocks new ledger writes whose occurred/settlement date falls in that YYYY-MM period until it is reopened.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Replays the stored response for the same user, key, endpoint, and request body. Reusing the key with a different request returns 409.
          schema: { type: string, maxLength: 160 }
        - in: path
          name: householdId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLedgerPeriodCloseRequest" }
      responses:
        "201":
          description: Ledger period closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerPeriodCloseResponse" }
        "400":
          description: Validation error or missing Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller is not an owner/admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Household not found or caller is not an active member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Idempotent request is in progress or Idempotency-Key was reused with a different request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /households/{householdId}/ledger/period-closes/{periodCloseId}/reopen:
    post:
